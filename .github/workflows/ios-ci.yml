name: iOS CI
run-name: iOS CI

on:
  workflow_dispatch:
    inputs:
      app-repository:
        description: App repository (owner/repo)
        required: true
        type: string
      pr-number:
        description: App pull request number
        required: true
        type: string
      commit-sha:
        description: Full SHA of the app pull request head
        required: true
        type: string
      operation:
        description: Xcode operation
        default: test
        type: choice
        options: [test, build]

permissions: {}

concurrency:
  group: ios-ci-${{ inputs.app-repository }}-${{ inputs.commit-sha }}-${{ inputs.operation }}
  queue: max

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Validate app and commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      owner: ${{ steps.target.outputs.owner }}
      repository: ${{ steps.target.outputs.repository }}
      project: ${{ steps.target.outputs.project }}
    steps:
      - name: Validate app and commit
        id: target
        shell: bash
        env:
          APP_REPOSITORY: ${{ inputs.app-repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          OPERATION: ${{ inputs.operation }}
          PROJECTS: ${{ vars.IOS_CI_PROJECTS || '{}' }}
        run: |
          if [[ ! "$APP_REPOSITORY" =~ ^[a-zA-Z0-9-]+/[a-zA-Z0-9_.-]+$ ||
                ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ||
                ! "$COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo 'Expected owner/repo, a PR number, and a full commit SHA' >&2
            exit 1
          fi
          case "$OPERATION" in
            build|test) ;;
            *) echo 'operation must be build or test' >&2; exit 1 ;;
          esac

          if ! project=$(jq -ce --arg repo "$APP_REPOSITORY" '
            .[$repo]
            | select(type == "object")
            | select([.project_path, .scheme, .destination] | all(type == "string" and length > 0))
          ' <<< "$PROJECTS"); then
            echo 'Set project_path, scheme, and destination for this repository in IOS_CI_PROJECTS' >&2
            exit 1
          fi

          if ! jq -e '
            (.runner | . == null or (type == "string" and length > 0))
            and (.xcode_version | . == null or (type == "string" and test("^[0-9]+(\\.[0-9]+){0,2}$")))
          ' <<< "$project" > /dev/null; then
            echo 'Set runner to a runner label and xcode_version to a quoted version such as "27.2", or omit either field' >&2
            exit 1
          fi

          if ! jq -e '.test_scheme | . == null or (type == "string" and test("[^[:space:]]"))' <<< "$project" > /dev/null; then
            echo 'Set test_scheme in IOS_CI_PROJECTS to a non-empty scheme name or omit it' >&2
            exit 1
          fi

          if ! jq -e '.test_package_path | . == null or (type == "string" and test("[^[:space:]]"))' <<< "$project" > /dev/null; then
            echo 'Set test_package_path in IOS_CI_PROJECTS to a Swift Package directory or omit it' >&2
            exit 1
          fi

          if ! jq -e '
            .test_targets
            | . == null or (type == "array" and all(.[];
                type == "string" and test("[^[:space:]]") and (test("[,[:cntrl:]]") | not)
              ))
          ' <<< "$project" > /dev/null; then
            echo 'Set test_targets in IOS_CI_PROJECTS to an array of non-empty test identifiers without commas or control characters' >&2
            exit 1
          fi

          printf 'owner=%s\nrepository=%s\nproject=%s\n' \
            "${APP_REPOSITORY%/*}" "${APP_REPOSITORY#*/}" "$project" >> "$GITHUB_OUTPUT"

      - name: Create pending status token
        id: pending-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.IOS_CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repository }}
          permission-statuses: write

      - name: Publish pending commit status
        if: steps.pending-token.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.pending-token.outputs.token }}
          APP_REPOSITORY: ${{ inputs.app-repository }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          OPERATION: ${{ inputs.operation }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST --silent "repos/$APP_REPOSITORY/statuses/$COMMIT_SHA" \
            --raw-field "state=pending" \
            --raw-field "context=ios-ci / $OPERATION" \
            --raw-field "description=iOS $OPERATION is in progress" \
            --raw-field "target_url=$RUN_URL"

  xcode:
    needs: prepare
    name: iOS build and test
    runs-on: ${{ fromJSON(needs.prepare.outputs.project).runner || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - name: Create read-only app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.IOS_CI_APP_PRIVATE_KEY }}
          owner: ${{ needs.prepare.outputs.owner }}
          repositories: ${{ needs.prepare.outputs.repository }}
          permission-contents: read

      - name: Check out app repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.app-repository }}
          ref: ${{ inputs.commit-sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: app

      - name: Run fastlane build or test
        working-directory: app
        shell: bash
        env:
          PROJECT_PATH: ${{ fromJSON(needs.prepare.outputs.project).project_path }}
          SCHEME: ${{ fromJSON(needs.prepare.outputs.project).scheme }}
          TEST_SCHEME: ${{ fromJSON(needs.prepare.outputs.project).test_scheme }}
          TEST_PACKAGE_PATH: ${{ fromJSON(needs.prepare.outputs.project).test_package_path }}
          DESTINATION: ${{ fromJSON(needs.prepare.outputs.project).destination }}
          XCODE_VERSION: ${{ fromJSON(needs.prepare.outputs.project).xcode_version }}
          OPERATION: ${{ inputs.operation }}
          TEST_TARGETS: ${{ join(fromJSON(needs.prepare.outputs.project).test_targets || '', ',') }}
          FASTLANE_DISABLE_OUTPUT_FORMAT: 'true'
          FASTLANE_HIDE_TIMESTAMP: 'true'
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_OPT_OUT_USAGE: 'true'
        run: |
          case "$PROJECT_PATH" in
            *.xcworkspace) project_option="workspace:$PROJECT_PATH" ;;
            *.xcodeproj) project_option="project:$PROJECT_PATH" ;;
            *) echo 'project_path must point to an .xcworkspace or .xcodeproj' >&2; exit 1 ;;
          esac
          if [[ -n "$XCODE_VERSION" ]]; then
            export DEVELOPER_DIR="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
            if [[ ! -x "$DEVELOPER_DIR/usr/bin/xcodebuild" ]]; then
              echo "Xcode $XCODE_VERSION is unavailable at $DEVELOPER_DIR" >&2
              exit 1
            fi
          fi

          git rev-parse HEAD
          xcodebuild -version
          xcrun swift --version

          command -v xcbeautify >/dev/null || { echo 'xcbeautify is required on the selected runner' >&2; exit 1; }
          fastlane_options=(
            "destination:$DESTINATION"
            "xcargs:-skipMacroValidation"
            "xcodebuild_formatter:xcbeautify --renderer github-actions"
          )

          build_app() {
            fastlane run build_app "${fastlane_options[@]}" "$project_option" "scheme:$SCHEME" skip_archive:true skip_profile_detection:true
          }

          case "$OPERATION" in
            build)
              build_app
              ;;
            test)
              test_scheme="${TEST_SCHEME:-$SCHEME}"
              if [[ -n "$TEST_PACKAGE_PATH" && ! -f "$TEST_PACKAGE_PATH/Package.swift" ]]; then
                echo "Package.swift was not found in test_package_path: $TEST_PACKAGE_PATH" >&2
                exit 1
              fi
              if [[ "$test_scheme" != "$SCHEME" || -n "$TEST_PACKAGE_PATH" ]]; then
                build_app
              fi
              if [[ -n "$TEST_TARGETS" ]]; then
                export SCAN_ONLY_TESTING="$TEST_TARGETS"
              fi
              test_options=("$project_option")
              if [[ -n "$TEST_PACKAGE_PATH" ]]; then
                test_options=(package_path:. result_bundle:true)
                if [[ "$PROJECT_PATH" == *.xcworkspace ]]; then
                  test_options+=("workspace:$PWD/$PROJECT_PATH")
                fi
                cd -- "$TEST_PACKAGE_PATH"
              fi
              fastlane run run_tests "${fastlane_options[@]}" "${test_options[@]}" "scheme:$test_scheme" skip_detect_devices:true skip_slack:true fail_build:true
              ;;
          esac

  report:
    needs: [prepare, xcode]
    if: always() && needs.prepare.result == 'success'
    name: Report result to app commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create commit status token
        id: status-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.IOS_CI_APP_PRIVATE_KEY }}
          owner: ${{ needs.prepare.outputs.owner }}
          repositories: ${{ needs.prepare.outputs.repository }}
          permission-statuses: write

      - name: Publish commit status
        shell: bash
        env:
          GH_TOKEN: ${{ steps.status-token.outputs.token }}
          APP_REPOSITORY: ${{ inputs.app-repository }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          OPERATION: ${{ inputs.operation }}
          RESULT: ${{ needs.xcode.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RESULT" in
            success) state=success; description="iOS $OPERATION passed" ;;
            failure) state=failure; description="iOS $OPERATION failed" ;;
            cancelled) state=error; description="iOS $OPERATION was cancelled" ;;
            *) state=error; description="iOS $OPERATION did not run" ;;
          esac

          gh api --method POST --silent "repos/$APP_REPOSITORY/statuses/$COMMIT_SHA" \
            --raw-field "state=$state" \
            --raw-field "context=ios-ci / $OPERATION" \
            --raw-field "description=$description" \
            --raw-field "target_url=$RUN_URL"
